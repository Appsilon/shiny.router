name: e2e

on:
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/**'
      - 'examples/**'
      - 'tests/e2e/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/e2e.yml'
  # No path filter on PRs: if the e2e checks are made required on main, a PR that touches none of the paths above
  # would get no e2e checks at all and wait for them forever.
  pull_request:

permissions:
  contents: read

jobs:
  # The checks are "e2e / e2e (Shiny latest)" and "e2e / e2e (Shiny 1.7.5.1)".
  e2e:
    uses: Appsilon/shiny.playwright/.github/workflows/e2e.yml@v0.1.0
    with:
      shiny-oldest: '1.7.5.1'
